<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#463126"><title>Migas | Cierre de caja</title><style>*{box-sizing:border-box}body{margin:0;background:#f3eee6;color:#463126;font:16px system-ui,-apple-system,sans-serif}.wrap{max-width:560px;margin:auto;padding:22px 17px 55px}.head{text-align:center}.logo{width:165px;height:130px;object-fit:contain}.sub{letter-spacing:2px;font-size:12px;font-weight:700}h1{font-family:Georgia,serif;font-size:27px;margin:12px 0 20px}label{display:block;font-size:13px;font-weight:650;margin:14px 0 6px}select,input{width:100%;padding:12px;border:1px solid #d4c4af;border-radius:10px;background:#fffaf3;color:#463126;font-size:16px}section{background:#fffaf3;border:1px solid #e0d4c4;border-radius:16px;padding:16px;margin:16px 0}h2{font-family:Georgia,serif;font-size:21px;margin:0 0 12px}.item{display:grid;grid-template-columns:1fr 95px 110px;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid #eee5d9}.item:last-child{border:0}.item input{text-align:center;padding:10px 4px}.amount{text-align:right;font-variant-numeric:tabular-nums;font-weight:650;font-size:14px}.total{background:#463126;color:#fff8ed;padding:22px;border-radius:16px;text-align:center}.total small{display:block;letter-spacing:1.5px}.total strong{display:block;font-size:37px;margin-top:7px}button{border:0;border-radius:11px;padding:15px 12px;font-weight:750;font-size:15px;cursor:pointer}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.primary{background:#74543c;color:white}.secondary{background:#e5d8c7;color:#463126}.hint{font-size:12px;color:#766451;text-align:center;margin-top:13px}@media(max-width:380px){.item{grid-template-columns:1fr 75px 92px}.amount{font-size:12px}}</style></head><body><main class="wrap"><div class="head"><img class="logo" src="logo.png" alt="Logo Migas"><div class="sub">PANADERÍA · PASTELERÍA</div><h1>Cierre de caja</h1></div><label for="branch">Sucursal</label><select id="branch"><option>Portal San Pedro 7284</option><option>Los Parques 734</option></select><label for="date">Fecha del cierre</label><input type="date" id="date"><label for="worker">Responsable (opcional)</label><input id="worker" placeholder="Nombre de quien cuenta"><section><h2>Billetes</h2><div id="bills"></div></section><section><h2>Monedas</h2><div id="coins"></div></section><div class="total"><small>TOTAL CONTADO EN CAJA</small><strong id="total">$0</strong></div><div class="buttons"><button class="primary" id="download">Descargar imagen</button><button class="primary" id="share">Compartir / WhatsApp</button><button class="secondary" id="clear" style="grid-column:1/-1">Limpiar cantidades</button></div><p class="hint">El comprobante incluye día, fecha, sucursal, desglose y total. Los datos se guardan en este dispositivo.</p></main><script>
const denominations=[20000,10000,5000,2000,1000,500,100,50,10];const money=n=>'$'+n.toLocaleString('es-CL');const $=id=>document.getElementById(id);const saved=JSON.parse(localStorage.getItem('migas-caja')||'{}');const now=new Date();const localDate=new Date(now.getTime()-now.getTimezoneOffset()*60000).toISOString().slice(0,10);$('date').value=localDate;$('branch').value=saved.branch||'Portal San Pedro 7284';$('worker').value=saved.worker||'';function getCounts(){return Object.fromEntries(denominations.map(d=>[d,Math.max(0,Math.floor(Number($('n'+d).value)||0))]))}function calculate(){const counts=getCounts();denominations.forEach(d=>$('s'+d).textContent=money(d*counts[d]));const total=denominations.reduce((a,d)=>a+d*counts[d],0);$('total').textContent=money(total);localStorage.setItem('migas-caja',JSON.stringify({counts,branch:$('branch').value,worker:$('worker').value}));return total}denominations.forEach((d,i)=>{const div=document.createElement('div');div.className='item';div.innerHTML=`<span>${money(d)}</span><input aria-label="Cantidad de ${money(d)}" type="number" min="0" step="1" inputmode="numeric" id="n${d}" placeholder="0" value="${saved.counts?.[d]||''}"><span class="amount" id="s${d}">$0</span>`;$(i<5?'bills':'coins').appendChild(div);$('n'+d).addEventListener('input',calculate)});$('branch').addEventListener('change',calculate);$('worker').addEventListener('input',calculate);calculate();$('clear').onclick=()=>{if(confirm('¿Limpiar todas las cantidades?')){denominations.forEach(d=>$('n'+d).value='');calculate()}};
const logo=new Image();logo.src='logo.png';const formattedDate=()=>{const [y,m,d]=$('date').value.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('es-CL',{weekday:'long',day:'numeric',month:'long',year:'numeric'})};function receipt(){const c=document.createElement('canvas');c.width=900;c.height=1280;const x=c.getContext('2d');x.fillStyle='#f8f1e6';x.fillRect(0,0,900,1280);x.fillStyle='#493426';x.textAlign='center';if(logo.complete&&logo.naturalWidth)x.drawImage(logo,340,36,220,190);x.font='bold 20px Arial';x.fillText('PANADERÍA · PASTELERÍA',450,254);x.font='bold 39px Georgia';x.fillText('CIERRE DE CAJA',450,321);x.font='25px Arial';x.fillText(formattedDate(),450,369);x.font='23px Arial';x.fillText($('branch').value,450,412);if($('worker').value.trim()){x.font='21px Arial';x.fillText('Responsable: '+$('worker').value.trim(),450,449)}x.strokeStyle='#c8b6a0';x.lineWidth=2;x.beginPath();x.moveTo(80,480);x.lineTo(820,480);x.stroke();x.textAlign='left';let y=528;const counts=getCounts();for(const d of denominations){if(counts[d]===0)continue;x.font='25px Arial';x.fillText(`${money(d)} × ${counts[d]}`,100,y);x.textAlign='right';x.fillText(money(d*counts[d]),800,y);x.textAlign='left';y+=48}const bottom=Math.max(1050,y+40);x.fillStyle='#493426';x.fillRect(70,bottom,760,125);x.fillStyle='#fff9ef';x.textAlign='center';x.font='21px Arial';x.fillText('TOTAL CONTADO',450,bottom+40);x.font='bold 43px Arial';x.fillText(money(calculate()),450,bottom+94);return c}async function blob(){return await new Promise(resolve=>receipt().toBlob(resolve,'image/png'))}function filename(){return 'Migas-cierre-'+$('date').value+'.png'}$('download').onclick=async()=>{const b=await blob();const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=filename();a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)};$('share').onclick=async()=>{const b=await blob();const file=new File([b],filename(),{type:'image/png'});if(navigator.canShare?.({files:[file]})){try{await navigator.share({files:[file],title:'Cierre de caja Migas'});return}catch(e){if(e.name==='AbortError')return}}const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=filename();a.click();alert('Imagen descargada. Puedes enviarla por WhatsApp desde Fotos o Archivos.')};
</script></body></html>
